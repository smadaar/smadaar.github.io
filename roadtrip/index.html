<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road Trip Planner</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #1f2937;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #fff6e7 0%, #ffe7b4 28%, #f8d0a0 55%, #f4c69f 100%);
      background-attachment: fixed;
    }

    .planner {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    header {
      margin-bottom: 32px;
      padding: 30px 28px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255, 236, 179, 0.95), rgba(255, 179, 71, 0.95));
      box-shadow: 0 20px 55px rgba(245, 146, 20, 0.18);
      border: 1px solid rgba(255, 205, 116, 0.35);
    }

    header h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 3.5vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: #1f2937;
      text-shadow: 0 1px 2px rgba(255,255,255,0.65);
    }

    .home-link {
      display: inline-block;
      margin-top: 6px;
      color: #1f2937;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .home-link:hover {
      text-decoration: underline;
    }

    header p {
      margin: 0;
      color: #475569;
      font-size: 1rem;
    }

    .travel-total {
      margin: 0;
      color: #1f2937;
      font-weight: 600;
    }

    .filter-btn {
      margin-left: auto;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 28px;
    }

    
    textarea#planner-json-editor {
      width: 100%;
      min-height: 320px;
      resize: vertical;
      border: 1px solid #cbd5e1;
      border-radius: 18px;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #0f172a;
      background: #f8fafc;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 999px;
      background: #f97316;
      color: white;
      padding: 10px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: #ea580c;
    }

    .btn.secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn.secondary:hover {
      background: #cbd5e1;
    }

    .checkbox-group-label {
      font-weight: 700;
      color: #1f2937;
      margin-right: 6px;
      white-space: nowrap;
    }

    .filter-checkbox {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(245, 158, 11, 0.16);
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .filter-checkbox:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 1);
    }

    .filter-checkbox input {
      width: 18px;
      height: 18px;
      accent-color: #f97316;
    }

    .filter-checkbox span {
      color: #1f2937;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .filter-checkbox-label {
      display: inline-flex;
      align-items: center;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      font-size: 0.95rem;
      color: #475569;
      margin-bottom: 12px;
    }

    .day-card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 26px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 18px 42px rgba(250, 183, 75, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.12);
    }

    .day-title {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin: 0 0 16px;
      flex-wrap: wrap;
    }

    .day-title h2 {
      margin: 0;
      font-size: 1.32rem;
      color: #1f2937;
    }

    .day-title .day-meta {
      color: #64748b;
      font-size: 0.95rem;
    }

    .collapse-toggle {
      background: none;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      padding: 0;
      font-size: 1.2rem;
      font-weight: bold;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .collapse-toggle:hover {
      border-color: #f97316;
      color: #f97316;
      background: rgba(249, 115, 22, 0.05);
    }

    .day-actions {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .add-item-btn {
      padding: 8px 12px;
      font-size: 0.86rem;
      line-height: 1;
    }

    .item-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 14px;
    }

    .item-row {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) 1.6fr minmax(120px, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 16px 18px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,248,232,0.95));
      border: 1px solid rgba(251, 191, 36, 0.16);
    }

    .item-row.tbc {
      background: linear-gradient(180deg, rgba(254,226,226,0.96), rgba(254,205,205,0.95));
      border-color: rgba(220, 38, 38, 0.3);
    }

    .item-row strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.96rem;
    }

    .item-body {
      min-width: 0;
    }

    .item-body p {
      margin: 0;
      color: #334155;
      font-size: 0.96rem;
      line-height: 1.5;
    }

    .travel-total {
      margin: 12px 0 0;
      color: #334155;
      font-size: 1rem;
      opacity: 0.82;
    }

    .item-meta {
      color: #475569;
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .map-link {
      display: inline-flex;
      align-items: center;
      margin-left: 8px;
      color: #f97316;
      font-weight: 700;
      text-decoration: none;
    }

    .map-link:hover {
      text-decoration: underline;
    }

    .link-group {
      display: inline-flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .item-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      white-space: nowrap;
    }

    .icon-btn {
      background: none;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 6px 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      color: #475569;
    }

    .icon-btn:hover {
      background: #fff;
      border-color: #f97316;
      color: #f97316;
    }

    .icon-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #ddd;
      color: #cbd5e1;
    }

    .icon-btn:disabled:hover {
      background: none;
      border-color: #ddd;
      color: #cbd5e1;
    }

    /* Modal styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal {
      background: white;
      border-radius: 24px;
      padding: 32px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.5rem;
      color: #1f2937;
    }

    .modal-close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #6b7280;
    }

    .modal-close-btn:hover {
      color: #1f2937;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #1f2937;
      font-size: 0.95rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .modal-footer {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }

    .modal-footer-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .btn.danger {
      background: #dc2626;
      color: white;
    }

    .btn.danger:hover {
      background: #b91c1c;
    }

    .btn.hidden {
      display: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
      border: 1px solid transparent;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35);
    }

    .badge.Activity {
      background: rgba(59, 130, 246, 0.12);
      color: #1d4ed8;
      border-color: rgba(59, 130, 246, 0.2);
    }

    .badge.Travel {
      background: rgba(249, 115, 22, 0.15);
      color: #c2410c;
      border-color: rgba(249, 115, 22, 0.2);
    }

    .badge.Drive {
      background: rgba(99, 102, 241, 0.15);
      color: #3730a3;
      border-color: rgba(99, 102, 241, 0.2);
    }

    .badge.Hotel {
      background: rgba(234, 179, 8, 0.18);
      color: #b45309;
      border-color: rgba(234, 179, 8, 0.22);
    }

    .empty-state {
      padding: 24px;
      margin-top: 24px;
      background: rgba(248,250,252,0.9);
      border: 1px dashed #cbd5e1;
      border-radius: 18px;
      color: #334155;
      text-align: center;
    }

    @media (max-width: 720px) {
      .planner {
        padding: 18px 12px 40px;
      }

      header {
        padding: 18px 16px;
        border-radius: 18px;
      }

      .day-card {
        padding: 14px;
        border-radius: 14px;
        margin-bottom: 14px;
      }

      .item-row {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 12px;
      }

      .item-row strong {
        font-size: 0.92rem;
      }

      .item-body p {
        font-size: 0.9rem;
        line-height: 1.3;
      }

      .item-meta {
        margin-top: 8px;
        font-size: 0.82rem;
        color: #475569;
      }

      .item-controls {
        gap: 6px;
        justify-content: flex-start;
      }

      .day-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .icon-btn {
        padding: 5px 6px;
        font-size: 0.8rem;
      }

      .filter-checkbox {
        padding: 8px 10px;
        gap: 8px;
        border-radius: 12px;
      }

      .filter-checkbox input {
        width: 16px;
        height: 16px;
      }

      .filter-checkbox span {
        font-size: 0.88rem;
      }

      .badge {
        padding: 6px 10px;
        font-size: 0.75rem;
      }

      .map-link {
        margin-left: 6px;
        font-size: 0.9rem;
      }

      .modal {
        width: 95%;
        padding: 20px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .modal-footer,
      .modal-footer-actions {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="planner">
    <header>
      <h1>California Road Trip Planner</h1>
      <p id="travel-total" class="travel-total"></p>
      <button class="btn secondary filter-btn" id="filter-btn">Filters</button>
    </header>

    <section id="planner"></section>

    <!-- Filter Modal -->
    <div id="filter-modal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2>Filter by Type</h2>
          <button class="modal-close-btn" id="filter-modal-close">&times;</button>
        </div>
        <div class="controls" id="type-filter">
          <span class="checkbox-group-label">Show type</span>
          <label class="filter-checkbox">
            <input type="checkbox" name="type" value="All" checked />
            <span class="filter-checkbox-label">All</span>
          </label>
          <label class="filter-checkbox">
            <input type="checkbox" name="type" value="Activity" />
            <span class="filter-checkbox-label">Activity</span>
          </label>
          <label class="filter-checkbox">
            <input type="checkbox" name="type" value="Travel" />
            <span class="filter-checkbox-label">Travel</span>
          </label>
          <label class="filter-checkbox">
            <input type="checkbox" name="type" value="Drive" />
            <span class="filter-checkbox-label">Drive</span>
          </label>
          <label class="filter-checkbox">
            <input type="checkbox" name="type" value="Hotel" />
            <span class="filter-checkbox-label">Hotel</span>
          </label>
          <label class="filter-checkbox">
            <input type="checkbox" name="type" value="Food" />
            <span class="filter-checkbox-label">Food</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Modal for editing items -->
    <div id="item-modal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2 id="item-modal-title">Edit Item</h2>
          <button class="modal-close-btn">&times;</button>
        </div>
        <form id="item-form">
          <div class="form-group">
            <label for="item-type">Type:</label>
            <select id="item-type" required>
              <option value="Activity">Activity</option>
              <option value="Travel">Travel</option>
              <option value="Hotel">Hotel</option>
              <option value="Food">Food</option>
            </select>
          </div>

          <div class="form-group">
            <label for="item-title">Title:</label>
            <input type="text" id="item-title" placeholder="Event title" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="item-start">Start time:</label>
              <input type="time" id="item-start" />
            </div>
            <div class="form-group">
              <label for="item-end">End time:</label>
              <input type="time" id="item-end" />
            </div>
          </div>

          <div class="form-group">
            <label for="item-notes">Notes:</label>
            <textarea id="item-notes" placeholder="Additional notes..."></textarea>
          </div>

          <div class="form-group">
            <label for="item-map-url">Map URL:</label>
            <input type="url" id="item-map-url" placeholder="https://www.google.com/maps/..." />
          </div>

          <div class="form-group">
            <label for="item-direction-url">Direction URL:</label>
            <input type="url" id="item-direction-url" placeholder="https://www.google.com/maps/dir/..." />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="item-from">From (location):</label>
              <input type="text" id="item-from" placeholder="Starting location" />
            </div>
            <div class="form-group">
              <label for="item-to">To (location):</label>
              <input type="text" id="item-to" placeholder="Destination" />
            </div>
          </div>

          <div class="form-group">
            <label for="item-travel-mode">Travel mode:</label>
            <select id="item-travel-mode">
              <option value="">Auto</option>
              <option value="driving">Driving</option>
              <option value="transit">Transit</option>
              <option value="walking">Walking</option>
              <option value="bicycling">Bicycling</option>
            </select>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn danger" id="modal-delete-btn">Delete</button>
            <div class="modal-footer-actions">
              <button type="button" class="btn secondary" id="modal-cancel-btn">Cancel</button>
              <button type="submit" class="btn">Save</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="roadtrip.js"></script>
</body>
</html>
